<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>Meal Calendar</title>
 <style>
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 background: #FAFAFA;
 color: #1C1C1E;
 margin: 0;
 padding: 0;
 }
 .container {
 max-width: 400px;
 margin: 0 auto;
 padding: 20px;
 }
 .header {
 font-weight: 600;
 font-size: 18px;
 text-align: center;
 margin-bottom: 20px;
 }
 .day {
 padding: 14px;
 border-bottom: 1px solid #E0E0E0;
 font-size: 15px;
 }
 .day-name {
 font-weight: 500;
 }
 .meal {
 color: #5A5A5C;
 font-size: 14px;
 margin: 4px 0;
 }
 .roles {
 font-size: 13px;
 color: #1C1C1E;
 }
 .duel {
 color: #FF6B35;
 font-weight: 500;
 }
 .back {
 display: block;
 color: #5A5A5C;
 font-size: 14px;
 text-align: center;
 margin-bottom: 10px;
 }
</style>
</head>
<body>
 <div class="container">

 <a href="#" class="back">← Home</a>

 <div class="header">📅 This Week</div>

 <div class="day">
 <div class="day-name">Monday</div>
 <div class="meal">Taco Night</div>
 <div class="roles">Cook: You | Cleanup: ⚔️ Duel</div>
 </div>

 <div class="day">
 <div class="day-name">Tuesday</div>
 <div class="meal">Stir Fry</div>
 <div class="roles">Cook: Jamie | Cleanup: You</div>
 </div>

 <div class="day">
 <div class="day-name">Wednesday</div>
 <div class="meal">Leftovers</div>
 <div class="roles">Cook: – | Cleanup: Jamie</div>
 </div>

 <div class="day">
 <div class="day-name">Thursday</div>
 <div class="meal">Pasta</div>
 <div class="roles">Cook: You | Cleanup: ⚔️ Duel</div>
 </div>
<a href="index.html">← Home</a>

 </div>
</body>
</html>
